name: Run Tests

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore LunchNear.slnx

    - name: Build
      run: dotnet build LunchNear.slnx --no-restore

    - name: Run tests
      run: dotnet test LunchNear.slnx --no-build --verbosity normal
