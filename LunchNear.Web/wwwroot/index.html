<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C95736" />
    <title>LunchNear</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="LunchNear.Web.styles.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.json" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot-splash">
            <div class="boot-logo">🍽️</div>
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    
    <script src="js/geolocation.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <script>
        // Service workers cache Blazor WASM assets aggressively. In local dev a stale worker
        // can serve empty dotnet.js and leave the app stuck on the boot splash forever.
        if ('serviceWorker' in navigator) {
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
                navigator.serviceWorker.getRegistrations()
                    .then(function (registrations) {
                        return Promise.all(registrations.map(function (registration) {
                            return registration.unregister();
                        }));
                    })
                    .then(function () {
                        if ('caches' in window) {
                            return caches.keys().then(function (keys) {
                                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
                            });
                        }
                    });
            } else {
                navigator.serviceWorker.register('service-worker.js');
            }
        }
    </script>
</body>

</html>
